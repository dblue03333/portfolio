name: Publish Scheduled Blog Notes

on:
  schedule:
    # Runs daily at 01:00 UTC (08:00 GMT+7)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build scheduled blog notes
        run: node scripts/build-blog.mjs

      - name: Commit and push newly published notes
        run: |
          if [[ -z "$(git status --porcelain blog/)" ]]; then
            echo "No new scheduled notes due today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/
          git commit -m "chore(blog): publish scheduled notes"
          git push
